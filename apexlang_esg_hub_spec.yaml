# ==============================================================================
# APEXLang Declaration: Autonomous Supplier Risk & ESG Compliance Hub
# Synthesized by ICA Edge Enterprise Orchestrator (Coding Agent)
# Target: Oracle APEX Application Builder 24.2+ / Redwood Light
# ==============================================================================

application:
  app_id: 1100
  name: "EcoVendor - Autonomous Supplier Risk & ESG Hub"
  alias: "ECOVENDOR_ESG"
  theme: "Theme 42 - Universal Theme"
  theme_style: "Redwood Light"
  authentication: "Application Express Accounts"
  navigation_type: "Side Navigation Menu"
  features:
    - progressive_web_app: true
    - feedback: true
    - activity_reporting: true
    - theme_style_selection: false

pages:
  # ----------------------------------------------------------------------------
  # Page 1: Executive KPI & Risk Analytics Dashboard
  # ----------------------------------------------------------------------------
  - page_id: 1
    page_name: "Executive ESG & Risk Overview"
    title: "Executive ESG & Risk Overview"
    page_mode: "Normal"
    regions:
      - region_name: "KPI Metrics Summary"
        type: "Cards (Badge / Numeric Summary)"
        template: "Cards"
        source_sql: |
          SELECT 'Total Active Suppliers' AS label, COUNT(*) AS value, 'fa-building' AS icon, 'u-color-1' AS color FROM ESG_SUPPLIERS
          UNION ALL
          SELECT 'High Financial Risk', COUNT(*), 'fa-exclamation-triangle', 'u-color-9' FROM ESG_SUPPLIERS WHERE FINANCIAL_RISK_INDEX = 'High'
          UNION ALL
          SELECT 'Avg Scope 3 Carbon (tCO2e)', ROUND(AVG(SCOPE3_CO2_TONNES), 1), 'fa-leaf', 'u-color-4' FROM ESG_SUPPLIER_AUDITS
          UNION ALL
          SELECT 'Audit Compliance Rate', ROUND((COUNT(CASE WHEN AUDIT_STATUS = 'Compliant' THEN 1 END) / COUNT(*)) * 100, 1) || '%', 'fa-shield-check', 'u-color-2' FROM ESG_SUPPLIERS

      - region_name: "Suppliers by ESG Grade Tier"
        type: "Chart (Donut)"
        source_sql: |
          SELECT ESG_RATING, COUNT(*) AS TOTAL_COUNT
          FROM ESG_SUPPLIERS
          GROUP BY ESG_RATING
          ORDER BY ESG_RATING

      - region_name: "Carbon Intensity Benchmark by Country"
        type: "Chart (Bar Horizontal)"
        source_sql: |
          SELECT COUNTRY, ROUND(AVG(CARBON_INTENSITY_SCORE), 1) AS AVG_CARBON_SCORE
          FROM ESG_SUPPLIERS
          GROUP BY COUNTRY
          ORDER BY AVG_CARBON_SCORE DESC

      - region_name: "Recent Risk Alerts & Escalations"
        type: "Cards (Timeline List)"
        source_sql: |
          SELECT a.ALERT_SEVERITY, a.ALERT_TYPE, a.ALERT_HEADLINE, a.ALERT_DATE, s.NAME AS SUPPLIER_NAME
          FROM ESG_RISK_ALERTS a
          JOIN ESG_SUPPLIERS s ON s.ID = a.SUPPLIER_ID
          WHERE a.IS_RESOLVED_YN = 'N'
          ORDER BY a.ALERT_DATE DESC
          FETCH FIRST 5 ROWS ONLY

  # ----------------------------------------------------------------------------
  # Page 2: Supplier ESG Directory (Faceted Search & Interactive Grid)
  # ----------------------------------------------------------------------------
  - page_id: 2
    page_name: "Supplier ESG Directory & Scoring"
    title: "Supplier ESG Directory & Scoring"
    page_mode: "Normal"
    regions:
      - region_name: "Search Filters"
        type: "Faceted Search"
        facets:
          - facet_name: "P2_COUNTRY"
            type: "Checkbox"
            db_column: "COUNTRY"
          - facet_name: "P2_ESG_RATING"
            type: "Checkbox"
            db_column: "ESG_RATING"
          - facet_name: "P2_FINANCIAL_RISK"
            type: "Radio Group"
            db_column: "FINANCIAL_RISK_INDEX"
          - facet_name: "P2_AUDIT_STATUS"
            type: "Checkbox"
            db_column: "AUDIT_STATUS"

      - region_name: "Suppliers Master Catalog"
        type: "Interactive Grid"
        editable: true
        source_table: "ESG_SUPPLIERS"
        actions:
          - button: "Quick Risk Audit"
            action: "Open Modal Page 3 (Passing P3_SUPPLIER_ID = &ID.)"
          - button: "Ask AI Copilot"
            action: "Toggle Right Drawer (Page 10)"

  # ----------------------------------------------------------------------------
  # Page 3: Supplier Audit & Corrective Action Modal Form
  # ----------------------------------------------------------------------------
  - page_id: 3
    page_name: "Supplier Audit & Mitigation Action"
    title: "Supplier Audit Details: &P3_NAME."
    page_mode: "Modal Dialog"
    items:
      - item_name: "P3_SUPPLIER_ID"
        type: "Hidden"
      - item_name: "P3_NAME"
        type: "Display Only"
      - item_name: "P3_ESG_RATING"
        type: "Select List"
        static_lov: "STATIC:Grade A;A,Grade B;B,Grade C;C,Grade D (Warning);D,Grade F (Critical);F"
      - item_name: "P3_CARBON_INTENSITY_SCORE"
        type: "Number Field"
      - item_name: "P3_CORRECTIVE_ACTIONS"
        type: "Textarea"
        label: "Mandatory Corrective Action Plan"
    dynamic_actions:
      - event: "Change"
        item: "P3_ESG_RATING"
        condition: "JavaScript: $v('P3_ESG_RATING') === 'D' || $v('P3_ESG_RATING') === 'F'"
        true_actions:
          - action: "Show"
            affected_items: ["P3_CORRECTIVE_ACTIONS"]
          - action: "Set Required"
            affected_items: ["P3_CORRECTIVE_ACTIONS"]
        false_actions:
          - action: "Hide"
            affected_items: ["P3_CORRECTIVE_ACTIONS"]

  # ----------------------------------------------------------------------------
  # Page 10: Embedded Oracle Select AI & Vector Assistant (Right Drawer)
  # ----------------------------------------------------------------------------
  - page_id: 10
    page_name: "Oracle GenAI Supplier Advisor"
    title: "ICA Edge GenAI Supplier Risk Advisor"
    page_mode: "Modal Drawer (Right)"
    components:
      - type: "Conversational AI Chat"
        model: "OCI GenAI Cohere / Llama 3"
        prompt_context: |
          You are the ESG Risk Intelligence Agent built into Oracle APEX. 
          Use the ESG_SUPPLIERS and ESG_SUPPLIER_AUDITS views to provide factual summaries, risk alerts, and mitigation recommendations.
